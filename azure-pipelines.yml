# Pipeline Backend - Bogota Chamber of Commerce
# Ejecución MANUAL desde Azure DevOps
# Build → Push to ACR → Deploy to Azure Container Apps

trigger: none

pr: none

variables:
  - group: azure-resources
  - group: backend-credentials
  - name: dockerfilePath
    value: '$(Build.SourcesDirectory)/Dockerfile'
  - name: imageRepository
    value: 'bogota-backend'
  - name: tag
    value: '$(Build.BuildId)'

stages:
  - stage: Build
    displayName: 'Build and Push Docker Image'
    jobs:
      - job: BuildAndPush
        displayName: 'Build Docker Image'
        pool:
          vmImage: 'ubuntu-latest'
        
        steps:
          - checkout: self
            displayName: 'Checkout code'
          
          - task: Docker@2
            displayName: 'Login to ACR'
            inputs:
              command: login
              containerRegistry: 'acr-connection'
          
          - task: Docker@2
            displayName: 'Build Docker image'
            inputs:
              command: build
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              containerRegistry: 'acr-connection'
              tags: |
                $(tag)
                latest
              arguments: '--no-cache'
          
          - task: Docker@2
            displayName: 'Push image to ACR'
            inputs:
              command: push
              repository: $(imageRepository)
              containerRegistry: 'acr-connection'
              tags: |
                $(tag)
                latest

  - stage: Deploy
    displayName: 'Deploy to Azure Container Apps'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployBackend
        displayName: 'Deploy Backend to Container Apps'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: 'Deploy to Container App'
                  inputs:
                    azureSubscription: 'azure-connection'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      echo "Deploying backend to Azure Container Apps..."
                      
                      az containerapp update \
                        --name $(BACKEND_APP_NAME) \
                        --resource-group $(RESOURCE_GROUP) \
                        --image $(ACR_LOGIN_SERVER)/$(imageRepository):$(tag) \
                        --cpu 1.0 \
                        --memory 2.0Gi \
                        --min-replicas 1 \
                        --max-replicas 5 \
                        --set-env-vars \
                          SUPABASE_URL=$(SUPABASE_URL) \
                          SUPABASE_KEY=$(SUPABASE_KEY) \
                          AZURE_OPENAI_ENDPOINT=$(AZURE_OPENAI_ENDPOINT) \
                          AZURE_OPENAI_API_KEY=$(AZURE_OPENAI_API_KEY) \
                          AZURE_OPENAI_DEPLOYMENT_NAME=$(AZURE_OPENAI_DEPLOYMENT_NAME) \
                          AZURE_OPENAI_DEPLOYMENT_ANALYSIS=$(AZURE_OPENAI_DEPLOYMENT_ANALYSIS) \
                          GROQ_API_KEY=$(GROQ_API_KEY)
                      
                      BACKEND_URL=$(az containerapp show \
                        --name $(BACKEND_APP_NAME) \
                        --resource-group $(RESOURCE_GROUP) \
                        --query properties.configuration.ingress.fqdn \
                        --output tsv)
                      
                      echo "Backend deployed successfully!"
                      echo "Backend URL: https://$BACKEND_URL"
